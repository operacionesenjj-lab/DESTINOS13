<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifiestos - Enrutador</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #5dade2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            max-width: 1200px;
        }
        .back-button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            font-weight: 600;
        }
        .back-button:hover {
            background: rgba(236, 240, 241, 0.9);
            color: #2c3e50;
        }
        h1 {
            color: white;
            font-size: 2.5rem;
            margin: 0;
            text-align: center;
        }
        .action-button {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            font-weight: 600;
            margin: 0.5rem;
        }
        .action-button:hover {
            background: rgba(236, 240, 241, 0.9);
            color: #2c3e50;
        }
        .action-button:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }
        .carpetas-container {
            margin-top: 2rem;
        }
        .carpeta-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin: 1rem 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        .carpeta-header {
            padding: 1.5rem;
            background: rgba(52, 152, 219, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease;
        }
        .carpeta-header:hover {
            background: rgba(52, 152, 219, 0.3);
        }
        .carpeta-nombre {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
        }
        .carpeta-contenido {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            display: none;
        }
        .carpeta-contenido.expanded {
            display: block;
        }
        .manifiesto-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 1rem 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .manifiesto-header {
            padding: 1rem;
            background: rgba(46, 204, 113, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .manifiesto-header:hover {
            background: rgba(46, 204, 113, 0.3);
        }
        .manifiesto-detalle {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            display: none;
            overflow-x: auto;
        }
        .manifiesto-detalle.expanded {
            display: block;
        }
        .tabla-manifiestos {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            min-width: 600px;
        }
        .tabla-manifiestos th,
        .tabla-manifiestos td {
            padding: 0.8rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #000;
            background: rgba(255, 255, 255, 0.9);
        }
        .tabla-manifiestos th {
            background: rgba(52, 152, 219, 0.8);
            color: white;
            font-weight: 600;
        }
        .cuadros-piezas {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin: 0.5rem 0;
        }
        .cuadro-pieza {
            width: 25px;
            height: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }
        .cuadro-pieza.escaneado {
            background: #27ae60;
            border-color: #27ae60;
            color: white;
        }
        .cuadro-pieza.escaneado::after {
            content: '✓';
            font-size: 0.7rem;
        }
        .file-input {
            display: none;
        }
        .mensaje {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 2rem;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .mensaje.success {
            background: #27ae60;
        }
        .mensaje.error {
            background: #e74c3c;
        }
        .faltantes-container {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            display: none;
        }
        .faltantes-container.visible {
            display: block;
        }
        .faltante-item {
            background: rgba(231, 76, 60, 0.2);
            padding: 0.5rem;
            margin: 0.3rem 0;
            border-radius: 4px;
            color: white;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            h1 { font-size: 1.8rem; text-align: left; }
            .main-container { padding: 0.8rem; max-width: 100%; }
            .cuadro-pieza { width: 22px; height: 22px; font-size: 0.75rem; }
            .cuadros-piezas { gap: 0.25rem; }
            .tabla-manifiestos { min-width: 100%; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-button" onclick="goBack()">Volver</button>
        <h1>Manifiestos</h1>
    </div>

    <div class="main-container">
        <div class="carpetas-controls" style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap;">
            <button id="agregarCarpeta" class="action-button" onclick="agregarCarpeta()">
                📁 Agregar Carpeta
            </button>
            <button id="eliminarCarpeta" class="action-button" onclick="eliminarCarpeta()" disabled>
                🗑️ Eliminar Carpeta
            </button>
            <button id="revisarFaltantes" class="action-button" onclick="revisarFaltantes()">
                🔍 Revisar Faltantes
            </button>
        </div>

        <div class="carpetas-container" id="carpetasContainer">
            <!-- Las carpetas se mostrarán aquí -->
        </div>

        <div class="faltantes-container" id="faltantesContainer">
            <h3>📋 Manifiestos Seleccionados para Revisión</h3>
            <div id="manifestosSeleccionados"></div>
            <button class="action-button" onclick="confirmarRevision()" style="margin-top: 1rem;">
                ✅ Confirmar Revisión
            </button>
            <button class="action-button" onclick="cancelarRevision()">
                ❌ Cancelar
            </button>
        </div>

        <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls" onchange="handleFileUpload(event)">
    </div>

    <script>
        let carpetas = [];
        let modoEliminarCarpetas = false;
        let modoRevisarFaltantes = false;
        let manifestosParaRevision = [];
        let manifiestosEscaneados = {};
        let carpetaEnModoEliminar = null;

        function goBack() {
            window.location.href = 'index.html';
        }

        function mostrarMensaje(mensaje, tipo = 'success') {
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = `mensaje ${tipo}`;
            mensajeDiv.textContent = mensaje;
            document.body.appendChild(mensajeDiv);

            setTimeout(() => {
                mensajeDiv.remove();
            }, 3000);
        }

        function guardarDatos() {
            try {
                localStorage.setItem('carpetas_manifiestos', JSON.stringify(carpetas));
            } catch (error) {
                console.error('Error guardando datos:', error);
                mostrarMensaje('Error al guardar los datos.', 'error');
            }
        }

        function cargarDatos() {
            try {
                const datosGuardados = localStorage.getItem('carpetas_manifiestos');
                if (datosGuardados) {
                    carpetas = JSON.parse(datosGuardados);
                }
                const escaneados = localStorage.getItem('manifiestos_escaneados');
                if (escaneados) {
                    manifiestosEscaneados = JSON.parse(escaneados);
                }
            } catch (error) {
                console.error('Error cargando datos:', error);
                carpetas = [];
            }
        }

        function agregarCarpeta() {
            const nombre = prompt('Ingresa el nombre de la nueva carpeta:');
            if (!nombre || nombre.trim() === '') {
                mostrarMensaje('Nombre de carpeta inválido.', 'error');
                return;
            }

            const nuevaCarpeta = {
                id: Date.now(),
                nombre: nombre.trim(),
                fecha: new Date().toLocaleString(),
                manifiestos: [],
                expandida: false
            };

            carpetas.push(nuevaCarpeta);
            guardarDatos();
            actualizarCarpetas();
            actualizarBotones();
            mostrarMensaje(`Carpeta "${nombre}" creada exitosamente.`);
        }

        function eliminarCarpeta() {
            if (carpetas.length === 0) {
                mostrarMensaje('No hay carpetas para eliminar.', 'error');
                return;
            }

            if (!modoEliminarCarpetas) {
                modoEliminarCarpetas = true;
                modoEliminarManifiestos = false; // Desactivar otros modos
                modoRevisarFaltantes = false;
                document.getElementById('faltantesContainer').classList.remove('visible');
                mostrarMensaje('Modo eliminación de carpetas activado. Selecciona las carpetas a eliminar.');
                actualizarCarpetas();
            } else {
                const carpetasSeleccionadas = carpetas.filter(carpeta => carpeta.seleccionada);
                
                if (carpetasSeleccionadas.length === 0) {
                    mostrarMensaje('No has seleccionado ninguna carpeta.', 'error');
                    return;
                }

                if (confirm(`¿Estás seguro de eliminar ${carpetasSeleccionadas.length} carpeta(s)?`)) {
                    carpetas = carpetas.filter(carpeta => !carpeta.seleccionada);
                    modoEliminarCarpetas = false;
                    guardarDatos();
                    actualizarCarpetas();
                    actualizarBotones();
                    mostrarMensaje(`${carpetasSeleccionadas.length} carpeta(s) eliminada(s).`);
                }
            }
        }

        function eliminarManifiestoCarpeta(carpetaId) {
            const carpeta = carpetas.find(c => c.id === carpetaId);
            if (!carpeta || carpeta.manifiestos.length === 0) {
                mostrarMensaje('No hay manifiestos para eliminar en esta carpeta.', 'error');
                return;
            }

            if (carpetaEnModoEliminar !== carpetaId) {
                // Activar modo eliminar para esta carpeta
                carpetaEnModoEliminar = carpetaId;
                modoEliminarCarpetas = false;
                modoRevisarFaltantes = false;
                document.getElementById('faltantesContainer').classList.remove('visible');
                mostrarMensaje('Modo eliminación activado. Selecciona los manifiestos a eliminar.');
                actualizarCarpetas();
            } else {
                // Confirmar eliminación
                const manifestosSeleccionados = carpeta.manifiestos.filter(m => m.seleccionado);
                
                if (manifestosSeleccionados.length === 0) {
                    mostrarMensaje('No has seleccionado ningún manifiesto.', 'error');
                    return;
                }

                if (confirm(`¿Estás seguro de eliminar ${manifestosSeleccionados.length} manifiesto(s) de la carpeta "${carpeta.nombre}"?`)) {
                    carpeta.manifiestos = carpeta.manifiestos.filter(m => !m.seleccionado);
                    carpetaEnModoEliminar = null;
                    guardarDatos();
                    actualizarCarpetas();
                    mostrarMensaje(`${manifestosSeleccionados.length} manifiesto(s) eliminado(s).`);
                }
            }
        }

        function toggleCarpeta(carpetaId) {
            if (modoEliminarCarpetas) return;
            
            const carpeta = carpetas.find(c => c.id === carpetaId);
            if (carpeta) {
                carpeta.expandida = !carpeta.expandida;
                guardarDatos();
                actualizarCarpetas();
            }
        }

        function toggleManifiesto(manifestoId) {
            if (carpetaEnModoEliminar) {
                // En modo eliminar, marcar/desmarcar para selección
                carpetas.forEach(carpeta => {
                    const manifiesto = carpeta.manifiestos.find(m => m.id === manifestoId);
                    if (manifiesto && carpeta.id === carpetaEnModoEliminar) {
                        manifiesto.seleccionado = !manifiesto.seleccionado;
                    }
                });
                actualizarCarpetas();
                return;
            }
            
            // Buscar el manifiesto y alternar su estado expandido
            carpetas.forEach(carpeta => {
                const manifiesto = carpeta.manifiestos.find(m => m.id === manifestoId);
                if (manifiesto) {
                    manifiesto.expandido = !manifiesto.expandido;
                }
            });
            guardarDatos();
            actualizarCarpetas();
        }

        function agregarManifiesto(carpetaId) {
            document.getElementById('fileInput').dataset.carpetaId = carpetaId;
            document.getElementById('fileInput').click();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            const carpetaId = parseInt(event.target.dataset.carpetaId);
            
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) {
                        mostrarMensaje('El archivo Excel está vacío.', 'error');
                        return;
                    }

                    const nuevoManifiesto = {
                        id: Date.now(),
                        nombre: file.name,
                        fecha: new Date().toLocaleString(),
                        datos: jsonData,
                        expandido: false
                    };

                    const carpeta = carpetas.find(c => c.id === carpetaId);
                    if (carpeta) {
                        carpeta.manifiestos.push(nuevoManifiesto);
                        guardarDatos();
                        actualizarCarpetas();
                        actualizarBotones();
                        mostrarMensaje(`Manifiesto "${file.name}" agregado exitosamente.`);
                    }
                } catch (error) {
                    console.error('Error procesando archivo:', error);
                    mostrarMensaje('Error al procesar el archivo Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function generarTablaManifiesto(manifiesto) {
            if (!manifiesto.datos || manifiesto.datos.length === 0) {
                return '<p style="color: rgba(255,255,255,0.5);">No hay datos para mostrar.</p>';
            }

            const filas = manifiesto.datos.slice(0, 20).map(row => {
                // Extraer datos según las columnas del Excel: A=RECIBO, B=AGENTE, C=CONSIGNATARIO, D=PIEZAS, F=DESTINO
                const recibo = row.__EMPTY || row.A || row.RECIBO || '';
                const agente = row.__EMPTY_1 || row.B || row.AGENTE || '';
                const consignatario = row.__EMPTY_2 || row.C || row.CONSIGNATARIO || '';
                const piezas = parseInt(row.__EMPTY_3 || row.D || row.PIEZAS || 0);
                const destino = row.__EMPTY_5 || row.F || row.DESTINO || '';
                
                return `
                    <tr>
                        <td>${recibo}</td>
                        <td>${agente}</td>
                        <td>${consignatario}</td>
                        <td>${piezas}</td>
                        <td>${destino}</td>
                    </tr>
                    <tr>
                        <td colspan="5">
                            <div class="cuadros-piezas">
                                ${generarCuadrosPiezas(manifiesto.id, recibo, piezas)}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            const mensajeMas = manifiesto.datos.length > 20 
                ? `<tr><td colspan="5" style="text-align: center; font-style: italic; color: #666;">... y ${manifiesto.datos.length - 20} registros más</td></tr>`
                : '';

            return `
                <table class="tabla-manifiestos">
                    <thead>
                        <tr>
                            <th>RECIBO</th>
                            <th>AGENTE</th>
                            <th>CONSIGNATARIO</th>
                            <th>PIEZAS</th>
                            <th>DESTINO</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filas}
                        ${mensajeMas}
                    </tbody>
                </table>
            `;
        }

        function generarCuadrosPiezas(manifestoId, recibo, cantidad) {
            const cuadros = Array.from({length: Math.min(cantidad, 50)}, (_, i) => {
                const key = `${manifestoId}_${recibo}_${i + 1}`;
                const escaneado = manifiestosEscaneados[key] ? 'escaneado' : '';
                return `<div class="cuadro-pieza ${escaneado}" data-key="${key}">${i + 1}</div>`;
            }).join('');
            
            const aviso = cantidad > 50 
                ? `<div style="width: 100%; color: #bdc3c7; font-size: 0.85rem;">Mostrando 50 de ${cantidad} piezas</div>`
                : '';
            
            return aviso + cuadros;
        }

        function revisarFaltantes() {
            if (!modoRevisarFaltantes) {
                modoRevisarFaltantes = true;
                modoEliminarCarpetas = false; // Desactivar otros modos
                modoEliminarManifiestos = false;
                manifestosParaRevision = [];
                document.getElementById('faltantesContainer').classList.add('visible');
                mostrarMensaje('Selecciona los manifiestos a revisar haciendo clic en ellos.');
                actualizarCarpetas();
            }
        }

        function cancelarRevision() {
            modoRevisarFaltantes = false;
            modoEliminarCarpetas = false;
            modoEliminarManifiestos = false;
            manifestosParaRevision = [];
            document.getElementById('faltantesContainer').classList.remove('visible');
            actualizarCarpetas();
        }

        function confirmarRevision() {
            if (manifestosParaRevision.length === 0) {
                mostrarMensaje('No has seleccionado ningún manifiesto.', 'error');
                return;
            }

            let faltantesHtml = '<h3>📋 Piezas Faltantes</h3>';
            
            manifestosParaRevision.forEach(manifiesto => {
                const faltantes = [];
                
                manifiesto.datos.forEach(row => {
                    const piezas = parseInt(row.PIEZAS) || 0;
                    const faltantesPieza = [];
                    
                    for (let i = 1; i <= piezas; i++) {
                        const key = `${manifiesto.id}_${row.RECIBO}_${i}`;
                        if (!manifiestosEscaneados[key]) {
                            faltantesPieza.push(i);
                        }
                    }
                    
                    if (faltantesPieza.length > 0) {
                        faltantes.push({
                            recibo: row.RECIBO,
                            faltantes: faltantesPieza,
                            total: piezas
                        });
                    }
                });
                
                if (faltantes.length > 0) {
                    faltantesHtml += `<h4>${manifiesto.nombre}</h4>`;
                    faltantes.forEach(item => {
                        faltantesHtml += `
                            <div class="faltante-item">
                                Recibo ${item.recibo}: faltan ${item.faltantes.length} pieza(s) [${item.faltantes.join(', ')}] de ${item.total}
                            </div>
                        `;
                    });
                }
            });

            document.getElementById('manifestosSeleccionados').innerHTML = faltantesHtml;
            mostrarMensaje('Revisión de faltantes generada.');
        }

        function seleccionarManifiesto(manifiesto) {
            if (!modoRevisarFaltantes) return;
            
            const index = manifestosParaRevision.findIndex(m => m.id === manifiesto.id);
            if (index === -1) {
                manifestosParaRevision.push(manifiesto);
            } else {
                manifestosParaRevision.splice(index, 1);
            }
            
            actualizarManifiestoSeleccionado();
        }

        function actualizarManifiestoSeleccionado() {
            let html = '<h4>Manifiestos Seleccionados:</h4>';
            if (manifestosParaRevision.length === 0) {
                html += '<p>Ningún manifiesto seleccionado.</p>';
            } else {
                manifestosParaRevision.forEach(m => {
                    html += `<div style="padding: 0.5rem; background: rgba(52, 152, 219, 0.2); margin: 0.3rem 0; border-radius: 4px;">${m.nombre}</div>`;
                });
            }
            document.getElementById('manifestosSeleccionados').innerHTML = html;
        }

        function toggleSeleccionCarpeta(carpetaId) {
            const carpeta = carpetas.find(c => c.id === carpetaId);
            if (carpeta) {
                carpeta.seleccionada = !carpeta.seleccionada;
            }
        }

        function actualizarCarpetas() {
            const container = document.getElementById('carpetasContainer');
            
            if (carpetas.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 2rem;">No hay carpetas creadas. Haz clic en "Agregar Carpeta" para crear una.</p>';
                return;
            }

            let html = '';
            carpetas.forEach(carpeta => {
                const checkbox = modoEliminarCarpetas 
                    ? `<input type="checkbox" onchange="toggleSeleccionCarpeta(${carpeta.id})" style="margin-right: 10px;">` 
                    : '';
                
                const expandIcon = carpeta.expandida ? '▼' : '▶';
                const contenidoClass = carpeta.expandida ? 'expanded' : '';
                
                html += `
                    <div class="carpeta-item">
                        <div class="carpeta-header" onclick="${modoEliminarCarpetas ? '' : `toggleCarpeta(${carpeta.id})`}">
                            <div>
                                ${checkbox}
                                <span style="margin-right: 10px;">${expandIcon}</span>
                                <span class="carpeta-nombre">${carpeta.nombre}</span>
                                <small style="color: rgba(255,255,255,0.7); margin-left: 1rem;">${carpeta.fecha}</small>
                            </div>
                            <div>
                                <span style="color: rgba(255,255,255,0.8);">${carpeta.manifiestos.length} manifiesto(s)</span>
                            </div>
                        </div>
                        <div class="carpeta-contenido ${contenidoClass}">
                            <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                                <button class="action-button" onclick="agregarManifiesto(${carpeta.id})">
                                    📄 Agregar Manifiesto
                                </button>
                                <button class="action-button" onclick="eliminarManifiestoCarpeta(${carpeta.id})" ${carpeta.manifiestos.length === 0 ? 'disabled' : ''}>
                                    🗑️ Eliminar Manifiesto
                                </button>
                            </div>
                            ${generarManifiestos(carpeta)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function generarManifiestos(carpeta) {
            if (carpeta.manifiestos.length === 0) {
                return '<p style="color: rgba(255,255,255,0.7);">No hay manifiestos en esta carpeta.</p>';
            }

            return carpeta.manifiestos.map(manifiesto => {
                const expandIcon = manifiesto.expandido ? '▼' : '▶';
                const detalleClass = manifiesto.expandido ? 'expanded' : '';
                
                // Checkbox para modo eliminar manifiestos (solo si esta carpeta está en modo eliminar)
                const checkbox = (carpetaEnModoEliminar === carpeta.id) 
                    ? `<input type="checkbox" ${manifiesto.seleccionado ? 'checked' : ''} onchange="toggleManifiesto(${manifiesto.id})" style="margin-right: 10px;">` 
                    : '';
                
                // Selección para revisar faltantes
                const seleccionado = modoRevisarFaltantes && manifestosParaRevision.some(m => m.id === manifiesto.id);
                const seleccionClass = seleccionado ? 'style="background: rgba(52, 152, 219, 0.4);"' : '';
                
                // Determinar la función onclick
                let onclickFunction = '';
                if (carpetaEnModoEliminar === carpeta.id) {
                    onclickFunction = `toggleManifiesto(${manifiesto.id})`;
                } else if (modoRevisarFaltantes) {
                    onclickFunction = `seleccionarManifiesto(${JSON.stringify(manifiesto).replace(/"/g, '&quot;')})`;
                } else {
                    onclickFunction = `toggleManifiesto(${manifiesto.id})`;
                }
                
                return `
                    <div class="manifiesto-item">
                        <div class="manifiesto-header" ${seleccionClass} onclick="${onclickFunction}">
                            <div>
                                ${checkbox}
                                <span style="margin-right: 10px;">${expandIcon}</span>
                                <strong>${manifiesto.nombre}</strong>
                                <small style="color: rgba(255,255,255,0.7); margin-left: 1rem;">${manifiesto.fecha}</small>
                            </div>
                            <div>
                                <span style="color: rgba(255,255,255,0.8);">${manifiesto.datos ? manifiesto.datos.length : 0} registro(s)</span>
                            </div>
                        </div>
                        <div class="manifiesto-detalle ${detalleClass}">
                            ${manifiesto.expandido ? generarTablaManifiesto(manifiesto) : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function actualizarBotones() {
            // Habilitar/deshabilitar botón eliminar carpetas
            document.getElementById('eliminarCarpeta').disabled = carpetas.length === 0;
            
            // Habilitar/deshabilitar botón eliminar manifiestos
            const totalManifiestos = carpetas.reduce((total, carpeta) => total + carpeta.manifiestos.length, 0);
            document.getElementById('eliminarManifiesto').disabled = totalManifiestos === 0;
        }

        // Cargar datos al iniciar la página
        window.addEventListener('DOMContentLoaded', function() {
            cargarDatos();
            actualizarCarpetas();
            actualizarBotones();
        });
    </script>
</body>
</html>
